# Tests the research engine and publishes the single-player web client
# (web/ + research/megagem packed for Pyodide) to GitHub Pages.
#
# One-time setup: repo Settings → Pages → Build and deployment →
# Source: "GitHub Actions".

name: Test and deploy Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Match the Python inside the Pyodide build the site loads.
          python-version: "3.13"
      - name: Unit tests
        working-directory: research
        run: python -m unittest discover
      - name: Headless CLI smoke test
        working-directory: research
        run: python -m megagem --all-ai --ai evo4 --seed 1 --quiet

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build site
        run: python web/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
